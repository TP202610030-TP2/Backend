# Plantilla: deploy.sh sustituye las ${VARIABLES} desde deploy/config.env.
# Horizontal autoscaling on HTTP concurrency (not CPU%): asr-service runs
# --workers 1 with a module-global Whisper model, so 2 concurrent requests per
# replica is already a queue. See docs/06-horizontal-autoscaling.md.
# El modelo va dentro de la imagen; con minReplicas 0 el primer request tras
# estar inactivo paga el arranque en frío (carga del modelo).
location: ${LOCATION}
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${ACA_ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8000
      transport: http
    secrets:
      - name: jwt-secret
        value: "${JWT_SECRET}"
  template:
    containers:
      - name: asr-service
        image: ${REGISTRY}/asr-service:${IMAGE_TAG}
        resources:
          cpu: 2.0
          memory: 4Gi
        env:
          - name: MODEL_ID
            value: QuechuaBase/whisper-base-qxp-finetuned
          - name: DEVICE
            value: cpu
          - name: ADAPTIVE_MODE
            value: "true"
          - name: AUTH_SERVICE_URL
            value: "${AUTH_SERVICE_URL}"
          - name: TRANSCRIPTION_MANAGER_URL
            value: "${TRANSCRIPTION_MANAGER_URL}"
          - name: MAX_CONCURRENT_CONNECTIONS
            value: "100"
          - name: STREAMING_PARTIAL_INTERVAL_SECONDS
            value: "3"
          - name: AUDIO_BUFFER_MAX_SECONDS
            value: "600"
          - name: PARTIAL_WINDOW_SECONDS
            value: "10"
          - name: SERVICE_NAME
            value: asr-service
          - name: AUTH_MODE
            value: local
          - name: JWT_SECRET_KEY
            secretRef: jwt-secret  # must equal auth-service's JWT_SECRET_KEY
          - name: JOB_WORKER_ENABLED
            value: "false"
        probes:
          - type: Liveness
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            failureThreshold: 2
          - type: Startup
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
    scale:
      minReplicas: ${MIN_REPLICAS_ASR}
      maxReplicas: ${MAX_REPLICAS_ASR}
      rules:
        - name: http-concurrency
          http:
            metadata:
              concurrentRequests: "2"
