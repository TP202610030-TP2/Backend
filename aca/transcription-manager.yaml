# Plantilla: deploy.sh sustituye las ${VARIABLES} desde deploy/config.env.
location: ${LOCATION}
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${ACA_ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8000
      transport: http
    secrets:
      - name: database-url
        value: "postgresql+asyncpg://${PG_ADMIN}:${PG_PASSWORD}@${PG_HOST}/trans_db?ssl=require"
  template:
    containers:
      - name: transcription-manager
        image: ${REGISTRY}/transcription-manager:${IMAGE_TAG}
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: DATABASE_URL
            secretRef: database-url
          - name: SERVICE_NAME
            value: transcription-manager
    scale:
      minReplicas: ${MIN_REPLICAS}
      maxReplicas: 2
      rules:
        - name: http-concurrency
          http:
            metadata:
              concurrentRequests: "10"
