# Plantilla: deploy.sh sustituye las ${VARIABLES} desde deploy/config.env.
# Único punto de entrada público. ALLOWED_ORIGINS (lista JSON) define CORS:
# cambiarla no requiere reconstruir la imagen, solo redesplegar esta app.
location: ${LOCATION}
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${ACA_ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8000
      transport: http
    secrets:
      - name: jwt-secret
        value: "${JWT_SECRET}"
  template:
    containers:
      - name: api-gateway
        image: ${REGISTRY}/api-gateway:${IMAGE_TAG}
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: SERVICE_NAME
            value: api-gateway
          - name: AUTH_SERVICE_URL
            value: "${AUTH_SERVICE_URL}"
          - name: USER_SERVICE_URL
            value: "${USER_SERVICE_URL}"
          - name: AUDIO_PROCESSOR_URL
            value: "${AUDIO_PROCESSOR_URL}"
          - name: ASR_SERVICE_URL
            value: "${ASR_SERVICE_URL}"
          - name: TRANSCRIPTION_MANAGER_URL
            value: "${TRANSCRIPTION_MANAGER_URL}"
          # v2 (docs/09-arquitectura-v2.md): JWT validated in the gateway, so
          # auth-service is no longer on the critical path of every request.
          - name: AUTH_MODE
            value: local
          - name: JWT_SECRET_KEY
            secretRef: jwt-secret  # must equal auth-service's JWT_SECRET_KEY
          - name: ALLOWED_ORIGINS
            value: '${ALLOWED_ORIGINS}'
    scale:
      minReplicas: ${MIN_REPLICAS_GATEWAY}
      maxReplicas: 2
      rules:
        - name: http-concurrency
          http:
            metadata:
              concurrentRequests: "10"
