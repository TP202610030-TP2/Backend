# Plantilla: deploy.sh sustituye las ${VARIABLES} desde deploy/config.env.
# SMTP_USER vacío => modo stub (los correos se registran en logs, no se envían).
location: ${LOCATION}
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${ACA_ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8000
      transport: http
    secrets:
      - name: database-url
        value: "postgresql+asyncpg://${PG_ADMIN}:${PG_PASSWORD}@${PG_HOST}/auth_db?ssl=require"
      - name: jwt-secret
        value: "${JWT_SECRET}"
      - name: smtp-password
        value: "${SMTP_PASSWORD}"
  template:
    containers:
      - name: auth-service
        image: ${REGISTRY}/auth-service:${IMAGE_TAG}
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: DATABASE_URL
            secretRef: database-url
          - name: JWT_SECRET_KEY
            secretRef: jwt-secret
          - name: JWT_ALGORITHM
            value: HS256
          - name: JWT_EXPIRATION_HOURS
            value: "24"
          - name: BCRYPT_ROUNDS
            value: "12"
          - name: RATE_LIMIT_ATTEMPTS
            value: "5"
          - name: RATE_LIMIT_WINDOW_MINUTES
            value: "15"
          - name: RECOVERY_TOKEN_LENGTH
            value: "32"
          - name: RECOVERY_TOKEN_EXPIRY_HOURS
            value: "1"
          - name: SMTP_HOST
            value: "${SMTP_HOST}"
          - name: SMTP_PORT
            value: "${SMTP_PORT}"
          - name: SMTP_USER
            value: "${SMTP_USER}"
          - name: SMTP_PASSWORD
            secretRef: smtp-password
          - name: SMTP_FROM
            value: "${SMTP_FROM}"
          - name: FRONTEND_URL
            value: "${FRONTEND_URL}"
    scale:
      minReplicas: ${MIN_REPLICAS}
      maxReplicas: 2
      rules:
        - name: http-concurrency
          http:
            metadata:
              concurrentRequests: "10"
