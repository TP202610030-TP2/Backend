# Plantilla: deploy.sh sustituye las ${VARIABLES} desde deploy/config.env.
location: ${LOCATION}
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${ACA_ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8000
      transport: http
    secrets:
      - name: database-url
        value: "postgresql+asyncpg://${PG_ADMIN}:${PG_PASSWORD}@${PG_HOST}/user_db?ssl=require"
      - name: smtp-password
        value: "${SMTP_PASSWORD}"
  template:
    containers:
      - name: user-service
        image: ${REGISTRY}/user-service:${IMAGE_TAG}
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: DATABASE_URL
            secretRef: database-url
          - name: AUTH_SERVICE_URL
            value: "${AUTH_SERVICE_URL}"
          - name: EMAIL_CONFIRMATION_TIMEOUT_SECONDS
            value: "30"
          - name: EMAIL_CHANGE_EXPIRY_HOURS
            value: "24"
          - name: MIN_AGE_YEARS
            value: "13"
          - name: SMTP_HOST
            value: smtp.gmail.com
          - name: SMTP_PORT
            value: "587"
          - name: SMTP_USER
            value: "${SMTP_USER}"
          - name: SMTP_PASSWORD
            secretRef: smtp-password
          - name: SMTP_FROM
            value: "${SMTP_FROM}"
          - name: FRONTEND_URL
            value: "${FRONTEND_URL}"
    scale:
      minReplicas: ${MIN_REPLICAS}
      maxReplicas: 1
