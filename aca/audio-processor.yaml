# Plantilla: deploy.sh sustituye las ${VARIABLES} desde deploy/config.env.
# El audio viaja a asr-service por HTTP (sync) o dentro de Redis (async), por
# lo que no se necesita volumen compartido en ACA.
location: ${LOCATION}
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${ACA_ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8000
      transport: http
    secrets:
      - name: database-url
        value: "postgresql+asyncpg://${PG_ADMIN}:${PG_PASSWORD}@${PG_HOST}/audio_db?ssl=require"
  template:
    containers:
      - name: audio-processor
        image: ${REGISTRY}/audio-processor:${IMAGE_TAG}
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: DATABASE_URL
            secretRef: database-url
          - name: ASR_SERVICE_URL
            value: "${ASR_SERVICE_URL}"
          - name: SERVICE_NAME
            value: audio-processor
    scale:
      minReplicas: ${MIN_REPLICAS}
      maxReplicas: 2
      rules:
        - name: http-concurrency
          http:
            metadata:
              concurrentRequests: "10"
