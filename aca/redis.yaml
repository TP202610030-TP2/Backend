# v2 (docs/09-arquitectura-v2.md): job queue (Redis Streams), job status
# store and token-revocation mirror. Internal-only TCP ingress — reachable as
# redis:6379 from the other apps in the environment, never from the internet.
# Plantilla: deploy.sh sustituye las ${VARIABLES} desde deploy/config.env.
location: ${LOCATION}
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${ACA_ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 6379
      exposedPort: 6379
      transport: Tcp
  template:
    containers:
      - name: redis
        image: docker.io/library/redis:7.2-alpine
        command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
        resources:
          cpu: 0.25
          memory: 0.5Gi
    scale:
      minReplicas: 1  # TCP ingress cannot wake from zero; stateful
      maxReplicas: 1  # never scale out a single-node Redis
