# v2 (docs/09-arquitectura-v2.md): asynchronous transcription workers.
# Same image as asr-service, run as a pure Redis Streams consumer (no
# ingress). Scaled by KEDA on the consumer-group backlog. minReplicas 0: no
# idle cost when there is no queued work (scale to zero).
# Plantilla: deploy.sh sustituye las ${VARIABLES} desde deploy/config.env.
location: ${LOCATION}
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${ACA_ENV_ID}
  configuration:
    activeRevisionsMode: Single
  template:
    containers:
      - name: asr-worker
        image: ${REGISTRY}/asr-service:${IMAGE_TAG}
        resources:
          cpu: 2.0
          memory: 4Gi
        env:
          - name: SERVICE_NAME
            value: asr-worker
          - name: MODEL_ID
            value: QuechuaBase/whisper-base-qxp-finetuned
          - name: DEVICE
            value: cpu
          - name: ADAPTIVE_MODE
            value: "true"
          - name: TRANSCRIPTION_MANAGER_URL
            value: http://transcription-manager
          - name: REDIS_URL
            value: redis://redis:6379/0
          - name: JOB_WORKER_ENABLED
            value: "true"
          - name: JOB_WORKER_CONCURRENCY
            value: "4"
    scale:
      minReplicas: 0
      maxReplicas: ${MAX_REPLICAS_WORKER}
      rules:
        - name: job-backlog
          custom:
            type: redis-streams
            metadata:
              address: redis:6379
              stream: asr:jobs
              consumerGroup: asr-workers
              # Lag-based: one replica per 8 jobs not yet delivered
              # (requires Redis >= 7.0 for consumer-group lag).
              lagCount: "8"
              activationLagCount: "1"
